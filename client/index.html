<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="shortcut icon" href="#" />
    <title>Bilregistrering</title>
  </head>
  <body
    class="min-h-[100vh] bg-gradient-to-b from-slate-800 to-slate-700 text-white"
  >
    <header class="mt-10 text-center">
      <h1 class="text-3xl">Bilregistrering</h1>
    </header>
    <main class="mt-10">
      <div class="w-[45rem] mx-auto mt-8 bg-white/25 p-3 rounded-lg">
        <form id="userForm">
          <div class="form-control my-4 mx-auto flex w-3/4 items-center">
            <label for="brand" class="mr-4 text-xl w-40">Märke</label>
            <input
              class="text-slate-800 p-1 flex-1 rounded-md"
              type="text"
              name="brand"
            />
          </div>
          <div class="form-control my-4 mx-auto flex w-3/4 items-center">
            <label for="model" class="mr-4 text-xl w-40">Model</label>
            <input
              class="text-slate-800 p-1 flex-1 rounded-md"
              type="text"
              name="model"
            />
          </div>
          <div class="form-control my-4 mx-auto flex w-3/4 items-center">
            <label for="regnr" class="mr-4 text-xl w-40">Regnr</label>
            <input
              class="text-slate-800 p-1 flex-1 rounded-md"
              type="text"
              name="regnr"
            />
          </div>
          <div class="form-control my-4 mx-auto flex w-3/4 items-center">
            <label for="color" class="mr-4 text-xl w-40">Färg</label>
            <select
              class="bg-white text-slate-800 p-1 flex-1 rounded-md"
              name="color"
            >
              <option value="stone">Svart</option>
              <option value="purple">Lila</option>
              <option value="green">Grön</option>
              <option value="gray">Grå</option>
              <option value="red">Röd</option>
              <option value="yellow">Gul</option>
            </select>
          </div>
          <div class="form-control my-4 mx-auto flex w-3/4 items-center">
            <label for="year" class="mr-4 text-xl w-40">Årsmodell</label>
            <input
              class="text-slate-800 p-1 flex-1 rounded-md"
              type="text"
              name="year"
            />
          </div>
          <div class="form-control my-4 mx-auto flex w-3/4 items-center">
            <label for="price" class="mr-4 text-xl w-40">Pris</label>
            <input
              class="text-slate-800 p-1 flex-1 rounded-md"
              type="text"
              name="price"
            />
          </div>
          <div class="form-control my-4 mx-auto flex w-3/4 items-center">
            <label for="forSale" class="mr-4 text-xl w-40">Annonstyp</label>
            <select
              class="bg-white text-slate-800 p-1 flex-1 rounded-md"
              name="forSale"
            >
              <option value="TRUE">Säljes</option>
              <option value="FALSE">Köpes</option>
            </select>
          </div>
          <div
            class="form-control my-4 mx-auto flex w-3/4 items-center justify-end gap-4"
          >
            <button
              class="px-4 py-1 bg-slate-200 text-slate-800 rounded-md hover:bg-slate-300"
              type="reset"
              name="clearUserForm"
            >
              Rensa
            </button>
            <button
              class="px-4 py-1 bg-slate-200 text-slate-800 rounded-md hover:bg-slate-300"
              type="submit"
              name="submitUserForm"
            >
              Skicka
            </button>
          </div>
        </form>
      </div>
      <div id="listContainer" class="w-[45rem] mx-auto mt-8"></div>
    </main>

    <div
      id="messageModal"
      class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm"
    >
      <div
        class="bg-slate-800 p-6 rounded-lg shadow-xl border border-slate-600 w-96 text-center"
      >
        <h2 id="messageText" class="text-xl font-bold mb-4 text-green-400"></h2>
        <div class="flex justify-center">
          <button
            id="closeMessageBtn"
            class="px-4 py-2 bg-slate-500 hover:bg-slate-600 rounded-md transition-colors"
          >
            Stäng
          </button>
        </div>
      </div>
    </div>

    <div
      id="deleteModal"
      class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm"
    >
      <div
        class="bg-slate-800 p-6 rounded-lg shadow-xl border border-slate-600 w-96 text-center"
      >
        <h2 class="text-xl font-bold mb-4">
          Är du säker att du vill ta bort
          <span id="modalCar" class="text-red-600"></span>?
        </h2>
        <div class="flex justify-center gap-4">
          <button
            id="cancelDelete"
            class="px-4 py-2 bg-slate-500 hover:bg-slate-600 rounded-md transition-colors"
          >
            Avbryt
          </button>
          <button
            id="confirmDelete"
            class="px-4 py-2 bg-red-600 hover:bg-red-700 rounded-md transition-colors"
          >
            Ta bort
          </button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
